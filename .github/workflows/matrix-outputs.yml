name: Matrix Aggregation

on:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 18, 20, 22 ]
    steps:
      - name: Run combination and write result file
        run: |
          mkdir -p out
          cat > out/node-${{ matrix.node }}.json << JSON
          {
            "node": "${{ matrix.node }}",
            "status": "passed",
            "duration_ms": $((RANDOM % 1000 + 200))
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: result-node-${{ matrix.node }}
          path: out/
          retention-days: 1

  aggregate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download every result artifact
        uses: actions/download-artifact@v4
        with:
          path: incoming/
          pattern: result-node-*
          merge-multiple: true

      - name: Aggregate
        run: |
          echo "Files received:"
          ls -la incoming/
          echo
          echo "Combined results:"
          jq -s '.' incoming/*.json
          echo
          PASS_COUNT=$(jq -s '[.[] | select(.status=="passed")] | length' incoming/*.json)
          TOTAL=$(jq -s 'length' incoming/*.json)
          echo "Quality gate: $PASS_COUNT / $TOTAL combinations passed"
          if [ "$PASS_COUNT" = "$TOTAL" ]; then
            echo "All combinations passed."
          else
            echo "Some combinations failed."
            exit 1
          fi
