name: Deploy

on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download artifact from triggering build run
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: incoming/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: |
          echo "Deploying build from SHA $(cat incoming/sha.txt)"
          cat incoming/build.txt
